title: Here to Help with Money UK
description: "Free, plain-English money help for everyday people in the UK — benefits, debt, savings, mortgages and more."
url: "https://tetsuakira-vk.github.io"
baseurl: "/ukfinance"

author:
  name: Here to Help with Money UK
  email: robertjohnathannelson@gmail.com

lang: en

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

paginate: 15
paginate_path: "/page/:num/"

permalink: /:year/:month/:title/

markdown: kramdown
highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - "*.sh"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
